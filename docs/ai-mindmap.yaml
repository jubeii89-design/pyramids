conventions:
  - docs/ai-mindmap.yaml is updated in the same change-set as every development (author rule, 2026-11-14)
  - rules are locked (see rules block); the scoring penalty is deliberate
  - humans only, 2-4 players
  - vanilla JS, no build step; Grunt only runs the browser suites
  - one server instance; room checkpoint is recovery, not a backup
  - licensing bar: nothing ships without documented provenance (see data/WORDLIST.md for the standard)
  - production requires PUBLIC_ORIGIN; behind a proxy set TRUST_PROXY=1
  - npm test must stay green and serialized (--test-concurrency=1 - parallel child servers hang small CI runners)
  - rights to the name/rules/art are unconfirmed - nothing public or paid until written permission exists (HANDOFF.md)
