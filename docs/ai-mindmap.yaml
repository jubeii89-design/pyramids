  M4:  # Reach everyone (P3)
    - id: M4-01
      title: ergonomics + accessibility - >=44px controls, remove maximum-scale=1, owner glyphs so colour is never the only signal, aria labels with display names, landscape, focus retention
      fixes: KI-10
      size: M
      acceptance: colour is never the only signal on any surface; every control outside the board grid is >=44x44 CSS px on the phone (the SC 2.5.5 AAA bar); board cells clear SC 2.5.8 Target Size (Minimum), AA, in portrait AND landscape, measured as the smaller dimension of the real rendered box in a browser rather than computed; pinch-zoom available on the phone
      status: 'done (3/3) - targets, pinch-zoom and landscape landed, then owner shapes, then semantics/keyboard/focus. Acceptance was restated once because ">=44px taps" cannot hold for board cells - 10 across a 390px phone is 32.0px by arithmetic and min-height on .cell would fight .board''s aspect-ratio and desync animatePlay''s cellAt() geometry, so the 44px bar (SC 2.5.5 Target Size (Enhanced), AAA) applies to every control OUTSIDE the grid, while cells are held to the 24px floor of SC 2.5.8 Target Size (Minimum), AA, which they clear on their own measured size - zoom is explicitly not a way to satisfy that criterion, so pinch-zoom is an ergonomic win rather than the conformance argument. Measured in Chromium at six phone sizes rather than computed - cell is 32.0x29.0 at 390x844 and 29.0x26.6 at 360x800 - HEIGHT is the binding dimension, not width, so 26.6px is the real worst case. STEP 3, the remaining third, closed six defects: toast() appended a bare div so a screen reader never heard a refusal or "You spelled X!", and now also writes to a polite live region (#srlive, created lazily on document.body - NOT inside #board, whose child count is locked by the keyed-renderer guard, and NOT a child of #gameview, an explicit grid where a new child auto-places and pushes the controls below the fold); the cell aria-label read the raw owner key, so a listener heard "red stack 3" and, worse, "yellow" for the player every other surface calls Gold, and now resolves opts.names then COLOR_NAMES; all 100 cells carried tabindex=0, a hundred tab stops to leave the board, and now exactly one does, with arrow keys, Home/End and edge clamping; there were no :focus-visible rings anywhere (style.css styled only input[type=text]:focus) so every button was invisible to a keyboard user; renderWordLine called replaceChildren() on every render - and renderGame runs on every inbound state and draft message, roughly every 120ms - throwing away the chip under the player''s finger and, because #wordline is aria-live, re-reading the whole word instead of the letter that changed, and now patches chips in place; and the Join button toggled the box then focused #code unconditionally, so CLOSING it focused an input inside a display:none subtree and dropped focus to <body>. Delivered by five agents on disjoint files with one serial gate; 24 new assertions were written BEFORE the gate, since the suite had exactly one accessibility assertion before this and nothing anywhere asserted tabindex, role, focus or keyboard.'
    - id: M4-02
      title: copy/tone pass - in-character string table (announcements like "ANN ROBBED BOB!"), one voice across pages
      size: M
      note: 're-sized from S to M after the strings were actually counted. The CLIENT half is tractable - roughly 90 user-facing strings across index/host/play and board.js, and the file convention for a shared public/strings.js already exists (a bare top-level const, like COLOR_NAMES, loaded by a plain script tag before board.js). The SERVER half is the problem and is why a flat key->string table cannot meet the acceptance as written: game.js composes refusals from fragments - a lead, a mid-clause and a tail across four refusal codes, 12 fragments rendering 16 sentences - and interpolates counts and positions with no pluralization. Worse, the client PARSES server prose: play.html matches /is taken/ against the name-clash error to decide whether to focus the name field, so rewording that one sentence silently breaks a behaviour no test covers. Either the server stops sending prose and sends a code plus values for the client to compose, or there are two tables and the acceptance says so.'
      acceptance: 'every user-facing string on the CLIENT comes from one table and no stale hint is possible by construction; server refusals are addressed by code rather than by prose, OR the acceptance is explicitly restated to cover two tables - as M4-01''s was - rather than quietly claimed'
    - id: M4-03
      title: board magnify/pan on the phone - an optional zoomed view of the grid, so cells can reach the AAA 44px bar
      size: M
      note: split out of M4-01, where the ">=44px taps" clause could not hold for board cells - 10 across a 390px phone is 32.0px by arithmetic, and min-height on .cell would fight .board's aspect-ratio
      acceptance: in the magnified mode every board cell's SMALLER rendered dimension is >=44px measured in a browser (SC 2.5.5 Target Size (Enhanced), AAA), the unmagnified board still clears the 24px AA floor, and animatePlay's cellAt() geometry stays in sync with the visible grid - the flying-tile animation must land on the right square in BOTH modes
    - id: M4-04
      title: deuteranope palette study - retune the four owner hues, keeping the shapes as the primary signal
      size: S
      note: split out of M4-01. The shapes landed there are the structural fix (colour is no longer the only signal); this is the hue work on top of it. Palette hues were deliberately left alone because the colours are player-facing names - Red/Blue/Green/Gold are spoken in the room, so a retune must not make a name a lie
      acceptance: the four hues are told apart under a simulated deuteranopia filter at tile size, the shapes still carry identity with colour removed entirely (greyscale render), and a real colour-blind player confirms it - the filter is evidence, not proof
  not_doing:  # deliberate scope walls - do not propose these
    - framework or build-step rewrite (vanilla JS is a decision)
    - accounts, databases, or multi-instance scaling
    - audience mode (beyond 4 players) in v1
    - AI opponents (author decision)
    - monetization beyond the existing optional TIP_URL link
    - changing any rule in the rules block above

conventions:
  - docs/ai-mindmap.yaml is updated in the same change-set as every development (author rule, 2026-11-14)
  - rules are locked (see rules block); the scoring penalty is deliberate
  - humans only, 2-4 players
  - vanilla JS, no build step; Grunt only runs the browser suites
  - one server instance; room checkpoint is recovery, not a backup
  - licensing bar: nothing ships without documented provenance (see data/WORDLIST.md for the standard)
  - production requires PUBLIC_ORIGIN; behind a proxy set TRUST_PROXY=1
  - npm test must stay green and serialized (--test-concurrency=1 - parallel child servers hang small CI runners)
  - rights to the name/rules/art belong to the author (confirmed by the author 2026-11-19); a human beta test is planned
  # Verification lessons, each earned by a real failure in this repo (2026-11-16).
  # They exist because the mistake was made once; do not re-learn them the hard way.
  - never pipe a gate to tail without pipefail - "npx grunt all | tail" reports TAIL's exit code, so a FAILING gate looked like exit 0; read the suite verdict text, not the status
  - measure layout in a browser, never from arithmetic - paper math for the landscape grid would have shipped ~22.6px cells on a 640x360 phone, and minmax(0, auto) silently collapsed the width:100% board to its 24px padding+border; both were invisible until measured
  - for touch targets the binding dimension is the SMALLER one - board cell HEIGHT (26.6px at 360px) is well under its width (29px), and WCAG 2.2 SC 2.5.8 asks whether a solid 24x24 square FITS INSIDE the target
  - zoom is not a conformance argument - W3C states SC 2.5.8 is independent of zoom, so pinch-zoom is an ergonomic win, never the reason a small target is acceptable
  - look at a 3x render before judging small UI - at an 8px floor the owner circle and square both collapsed to the same dot on a phone, and a 1x screenshot is blurrier than any real device, so it flatters nothing and hides this
  - a test must fail, never abort - boundingBox() on a locator matching nothing waits the full 30s and THROWS, turning one soft check failure into a dead suite; guard with count() first
  - a helper that gives up must give up loudly - tapWord returned silently after its retries, leaving an empty word line so every later check failed with no clue which was the cause
  - 'assert what you mean, not a superset - a U+25A0-U+25FF range meant to catch new CSS glyphs swept up the real U+25B2 turn marker #scores has always printed'
  - verify a test's own premise against the data - the refused-word check assumed a reversed/rotated word is not a word; swept over the list it would assert a REAL word for 123 of 80495 candidates, a latent ~0.15% red
  - diagnose flakes, do not just raise the retry count - two symptoms in the tap suite (a lost letter and a dead host mirror) turned out to be ONE deterministic bug, and the retry loop was itself the thing starving the draft relay; instrumenting the failure found it in one run after three wrong theories from reading alone
  - write the tests before starting the gate - a 25-minute gate run that does not include the new assertions proves nothing
  - size a surface people TAP with svh, never dvh - the dynamic viewport grows as a phone's URL bar hides, so a dvh-sized board resizes under a thumb already aiming at a ~29px cell; note headless Chromium has no URL bar, so svh/dvh/vh measure identically there and a green gate proves no regression, not the fix
  - never reuse a glyph that already carries meaning in the same UI - check the existing vocabulary first; the owner shape for Green collided with the turn marker and only a read-through of the rendered row caught it
  - guard every value handed to page.evaluate - an undefined argument throws inside the page and kills the run, the same abort-instead-of-fail trap as an unguarded boundingBox()
  - tee a long gate to a file, never pipe it only through tail - tail buffers, so when a 25-minute run was stopped at its time limit the ENTIRE output was lost and the run proved nothing; `npx grunt all 2>&1 | tee gate.log | tail -5` keeps the partial transcript and still shows the verdict
  - 'a space-hash inside a plain YAML scalar starts a COMMENT, so this file was silently dropping its own content - M4-01 status held 4606 characters but any parser saw only 1798 of them, because " #controls off-turn dimming" ended the scalar; features_existing lost "#seat=TOKEN link" and a convention lost its closing clause the same way. CSS ids, channel names and issue numbers in prose all trigger it. Quote any value that contains one (single quotes, doubling internal apostrophes), and after editing this file do not merely check that it PARSES - diff the parsed character count against the raw line, because a truncated scalar parses perfectly and reads fine to a human looking at the file.'
  - 'a label written inside a keyed renderer''s did-this-change branch bakes in whatever data was available the last time the CONTENT changed - the board''s aria-label sat inside the sig branch and the sig held no player name, so threading names through would have silently done nothing for the ~90 cells that never change again after the opening render, while passing a naive test on a cell that had just changed. If a label depends on data that arrives LATER (names come with the room message), compute it every render and write it only when it differs; do not add the data to the sig instead, because a sig change rewrites innerHTML and destroys the tile markup and any ghost-letter child.'
  - 'box-shadow does not stack - a winning rule replaces the whole value - so a focus ring written in box-shadow silently erases an existing inset shadow at equal specificity. .cell.path-hint and .cell.runway both keep their hint in an inset box-shadow at (0,2,0) and .btn keeps its 3D edge there too, so focus rings use outline + outline-offset, which also paint outside the layout box and therefore cannot disturb a measured tap target.'
  - 'classic scripts share ONE global lexical scope, so a new top-level let/const/function in board.js collides with an inline script''s binding of the same name as a parse-time SyntaxError that blanks the entire page - grep every public/*.html for the name before adding one.'
  - 'parallel agents must own DISJOINT files and the gate must stay serial - the suites bind fixed ports 3123/3124/3127 and two runs at once corrupt each other, so the parallelism belongs in the editing and never in the verification; freeze the shared names (ids, classes, function signatures) in a written contract before any lane starts, because that contract is the only coupling between them.'
  - 'smoke the changed pages in a browser for ten seconds before starting a 25-minute gate - load each page, collect pageerror and console.error, and assert the two or three things the change was supposed to do. A syntax error or a dead handler is found in seconds instead of after half an hour, and the gate then runs once rather than twice.'
  - 'a browser test that taps board squares puts the BLACK square last. anchorItem() is null until a black letter is in the build and onCell reads neighbourOf() before its own push, so with the black square last no tap can be eaten as a direction tap, whatever the board layout. Tapping it earlier made the eaten tap depend on where the opponent''s opening word left the anchor - measured at 26 of 400 boards, which reads as a 4% flake in CI and cost a diagnosis session.'
  - 'a test that asserts a drop is not evidence the drop was wanted. test/draft.test.js asserted "bursts under 50 ms are dropped" and so protected a defect that left the TV showing a half-spelled word for the rest of a turn - its burst happened to end with an empty clear, which always relays, so the case that mattered was never covered. When a test documents a loss, check whether anyone ever decided the loss was acceptable.'
  - 'check the subagent, not just the diff - a parallel lane''s report claimed the landing page needed aria-hidden on its decorative board, which was already there, and another proposed a tap target as a deterministic trigger without confirming the square was empty. Both were plausible and written with confidence. Verify a delegated claim against the code the same way you would your own.'
