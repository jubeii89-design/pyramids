      fixes: KI-06
      size: M
      acceptance: code legible at 3m on a 1080p TV; tile letters >= ~28px rendered
      status: done - container-type inline-size on .boardwrap with cqw font clamps (vmin fallback lines kept for pre-2023 browsers); host wrap 1200 -> 1700px so the 1080p board is vh-capped (~925px) not width-capped; @media >=1500px scales header/code/scores/tracker/log/draftline; at 1080p letters ~44px + values ~20px (acceptance met); phone floor raised 7 -> 8px, no layout change at 390px
    - id: M2-04
      title: sound - small synthesized/CC0 set (join, your-turn chime, word played, steal, game over) + mute; licences documented like the word list
      size: M
      acceptance: every sound's provenance in a SOUNDS.md; mute persists
