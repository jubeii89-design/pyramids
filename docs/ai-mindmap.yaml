      acceptance: a state update touches only changed cells; existing Playwright suites still pass
    - id: M2-02
      status: done (delivered in PR #8; no capture-count digits in Scores — nothing readable as a score during play, per the locked hidden-scores rule; the Pyramid Tracker alone shows depletion)
