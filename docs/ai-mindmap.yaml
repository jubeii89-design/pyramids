      status: done - server stores/serializes penalties at over (null during play); shared finalsRevealHTML/tieBreakStageHTML/animateFinalsReveal in board.js; host stages rows (CSS delays + eased count-up, all gated text synchronous in the DOM, one run per gameId); phone static with own row highlighted "(you)"; prefers-reduced-motion skips straight to finals; ui.js now asserts the per-player math rows + staged draw pyramids
